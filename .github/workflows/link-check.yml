

name: Check research links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install Lychee
        run: |
          curl -sSfL https://raw.githubusercontent.com/lycheeverse/lychee/master/install.sh | sh

      - name: Check Markdown links
        run: lychee --verbose --no-progress --no-ignore README.md


